[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "orbitkv-llm"
version = "0.1.0"
description = "Framework adapters and Python bindings for the OrbitKV state cache"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "OrbitKV Contributors" }
]
dependencies = [
    "httpx>=0.24.0",
]
keywords = ["storage", "kv-cache", "rust", "vllm", "sglang", "inference"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.urls]
Homepage = "https://github.com/feichai0017/orbitkv"
Repository = "https://github.com/feichai0017/orbitkv"
Issues = "https://github.com/feichai0017/orbitkv/issues"

[project.optional-dependencies]
vllm = ["vllm==0.29.0"]
sglang = ["sglang==0.5.20"]

[tool.uv]
conflicts = [[{ extra = "vllm" }, { extra = "sglang" }]]

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "numpy>=1.24",
    "requests>=2.26.0",
]
dev = [
    { include-group = "test" },
    "ruff>=0.4",
    "mypy>=1.10",
]
bench = ["requests>=2.26.0"]

[tool.maturin]
module-name = "orbitkv.orbitkv"
python-source = "."
python-packages = ["orbitkv"]
exclude = ["**/__pycache__/**", "**/*.pyc", "**/.pytest_cache/**"]
strip = true
# Automatically include binaries defined in Cargo.toml [[bin]] sections
include = [
    "orbitkv/orbitkv-cache-manager-py",
    "orbitkv/libtransfer_engine.so",
    "orbitkv/libmooncake_common.so",
    "orbitkv/libasio.so",
]

[project.scripts]
orbitkv-cache-manager = "orbitkv._cache_manager:main"

[project.entry-points."vllm.general_plugins"]
orbitkv = "orbitkv.vllm.plugin:register"

[project.entry-points."sglang.srt.plugins"]
orbitkv = "orbitkv.sglang.plugin:register"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "-m",
    "not integration and not e2e and not stress and not gpu",
]
markers = [
    "integration: starts or requires Cache Manager but does not run vLLM",
    "e2e: runs inference-engine correctness and recovery checks",
    "stress: long-running vLLM scenario for concurrency or pressure behavior",
    "gpu: requires CUDA-capable GPU",
    "slow: may take more than a few seconds",
    "release_smoke: validates final installed artifact/runtime rather than source tree",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["orbitkv"]
omit = ["tests/*", "orbitkv/orbitkv.pyi"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # Line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["orbitkv", "benches", "tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.isort]
profile = "black"
known_first_party = ["orbitkv", "benches", "tests"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_files = ["pyproject.toml:^version", "../Cargo.toml:^version"]
tag_format = "v$version"
