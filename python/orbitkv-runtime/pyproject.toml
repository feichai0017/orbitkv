[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitkv-runtime"
version = "0.1.0"
description = "Engine-neutral Python contracts for OrbitKV data-plane adapters."
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
