[workspace]
members = [
    "crates/loom-infer-cuda",
    "crates/loom-infer",
]
default-members = [
    "crates/loom-infer",
    "crates/loom-infer-cuda",
]
resolver = "2"

[workspace.package]
version = "1.0.0-alpha.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/feichai0017/loom-infer"
homepage = "https://feichai0017.github.io/loom-infer/"

[workspace.dependencies]
half = "2.7"
thiserror = "2.0"
