[workspace]
resolver = "2"
members = [
    "crates/aletheia-contracts",
    "crates/aletheia-control",
    "crates/aletheia-executor",
    "crates/aletheia-cli",
]
default-members = [
    "crates/aletheia-contracts",
    "crates/aletheia-control",
    "crates/aletheia-executor",
    "crates/aletheia-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
aletheia-contracts = { path = "crates/aletheia-contracts" }
aletheia-control = { path = "crates/aletheia-control" }
aletheia-executor = { path = "crates/aletheia-executor" }

clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
