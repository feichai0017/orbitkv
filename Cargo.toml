[workspace]
members = [
    "crates/orbitkv",
    "crates/orbitkv-compiler",
    "crates/orbitkv-cuda",
    "crates/orbitkv-engine",
    "crates/orbitkv-executor",
    "crates/orbitkv-ops",
    "crates/orbitkv-tracing",
]
# The CUDA backend's device tests require a CUDA toolchain and a GPU.
default-members = [
    "crates/orbitkv",
    "crates/orbitkv-compiler",
    "crates/orbitkv-engine",
    "crates/orbitkv-executor",
    "crates/orbitkv-ops",
    "crates/orbitkv-tracing",
]
resolver = "3"

[workspace.package]
authors = ["feichai"]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/feichai0017/orbitkv"

[workspace.dependencies]
orbitkv = { path = "crates/orbitkv" }
orbitkv-compiler = { path = "crates/orbitkv-compiler" }
orbitkv-cuda = { path = "crates/orbitkv-cuda" }
orbitkv-engine = { path = "crates/orbitkv-engine" }
orbitkv-executor = { path = "crates/orbitkv-executor" }
orbitkv-ops = { path = "crates/orbitkv-ops" }
orbitkv-tracing = { path = "crates/orbitkv-tracing" }

[patch.crates-io]
candle-kernels = { git = "https://github.com/huggingface/candle.git", rev = "a0dbd8b8aef6bde9adca3e8ad90791609d64974b" }
