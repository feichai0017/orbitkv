[workspace]
members = [
  "crates/orbitkv-contract",
  "crates/orbitkv-local",
  "crates/orbitkv-common",
  "crates/orbitkv-core",
  "crates/orbitkv-proto",
  "crates/orbitkv-server",
  "crates/orbitkv-metaserver",
  "crates/orbitkv-mooncake-provider",
  "crates/orbitkv-transfer",
  "python",
]
exclude = ["third-party/mooncake"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.dependencies]
# Workspace members
orbitkv-contract = { path = "crates/orbitkv-contract" }
orbitkv-local = { path = "crates/orbitkv-local" }
orbitkv-common = { path = "crates/orbitkv-common" }
orbitkv-core = { path = "crates/orbitkv-core", default-features = false }
orbitkv-mooncake-provider = { path = "crates/orbitkv-mooncake-provider", default-features = false }
orbitkv-transfer = { path = "crates/orbitkv-transfer", default-features = false }

# Core dependencies
# 0.19.7 floor: its regenerated bindings turn several sys enums into newtype
# structs (CUmemAllocationHandleType etc.); cuda_sys.rs and cumem.rs address
# them in that form.
cudarc = { version = "0.19.7" }
offset-allocator = "0.2.0"
hashlink = "0.11.0"
tokio = { version = "1.48.0", features = ["full"] }
rand = "0.10"
shared_memory = "0.12"
uuid = { version = "1.22", features = ["v4"] }
parking_lot = "0.12"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
libloading = "0.9"
dashmap = "6.1"
opentelemetry = { version = "0.31.0", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.31.0", features = [
  "trace",
  "metrics",
  "grpc-tonic",
] }
opentelemetry_sdk = { version = "0.31.0", features = [
  "trace",
  "metrics",
  "rt-tokio-current-thread",
] }
opentelemetry-prometheus = "0.31"
prometheus = "0.14"
bytesize = "2.3.1"
anyhow = "1.0"
bytes = { version = "1.10", features = ["serde"] }
ahash = "0.8"
futures = "0.3"
smallvec = { version = "1.15", features = ["serde", "union"] }
mea = "0.6.3"
iceoryx2 = { version = "0.10.0", default-features = false, features = ["std"] }
memmap2 = "0.9.11"
rustix = { version = "1.1", features = ["event", "fs", "net", "process"] }

# HTTP/Web
axum = "0.8"
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-stream = "0.1"

# grpc
prost = "0.14"
tonic = "0.14"
tonic-prost = "0.14"

# Python bindings
pyo3 = { version = "0.28" }
pyo3-build-config = { version = "0.28", features = ["resolve-config"] }
# Redis

# Logging
log = "0.4"
logforth = { version = "0.29", features = ["starter-log","layout-text"] }
colored = "3.1"
fastrace = "0.7.17"

# Dev dependencies
criterion = "0.8"

tikv-jemallocator = "0.6.1"

[workspace.lints.clippy]
checked_conversions = "warn"
cloned_instead_of_copied = "warn"
dbg_macro = "warn"
allow_attributes_without_reason = "warn"
await_holding_refcell_ref = "warn"
await_holding_lock = "warn"
let_underscore_future = "warn"
mem_forget = "warn"
unimplemented = "warn"
unused_result_ok = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
inefficient_to_string = "warn"
let_unit_value = "warn"
manual_assert = "warn"
manual_ok_or = "warn"
semicolon_if_nothing_returned = "warn"
todo = "warn"
unnecessary_wraps = "warn"
useless_transmute = "warn"

[workspace.lints.rust]
elided_lifetimes_in_paths = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_lifetimes = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"
