[package]
name = "orbitkv"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Compile attention retention into safe and efficient KV-block plans."
license = "MIT"
repository = "https://github.com/feichai0017/oxide-infer"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
