[workspace]
members = [
    "crates/oxide-infer-cuda",
    "crates/oxide-infer-lab",
    "crates/oxide-infer",
]
default-members = [
    "crates/oxide-infer",
    "crates/oxide-infer-cuda",
]
resolver = "2"

[workspace.package]
version = "1.0.0-alpha.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/feichai0017/oxide-infer"
homepage = "https://feichai0017.github.io/oxide-infer/"

[workspace.dependencies]
half = "2.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
