[package]
name = "orbitkv-compiler"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/feichai0017/orbitkv"
description = "Compiler and kernel toolchain for stateful hybrid inference"

[dependencies]
kern-manifest = { git = "https://github.com/pegainfer-project/kern", rev = "05df6d9cf8233b2438a7a584ce4ed7a0666abf53" }
serde = { version = "1", features = ["derive"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
