name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check package versions and release tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            python3 scripts/check-versions.py --tag "$RELEASE_TAG"
          else
            python3 scripts/check-versions.py
          fi

  build:
    needs: version
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        cuda-variant: ['cu12', 'cu13']
        include:
          - cuda-variant: cu12
            cuda-version: '12.8.1'
            cargo-features: ""
          - cuda-variant: cu13
            cuda-version: '13.0.2'
            cargo-features: "--no-default-features --features cuda-13,mooncake"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Initialize native build dependency
        run: git submodule update --init --recursive --depth 1 third-party/mooncake

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ matrix.cuda-version }}
          linux-local-args: '["--toolkit"]'
          method: 'network'
          sub-packages: '["nvcc", "nvrtc-dev", "cudart-dev"]'

      - name: Install protobuf compiler and RDMA headers
        run: |
          sudo apt-get update
          # Explicitly select glog's headers over the runner's LLVM libunwind variant.
          sudo apt-get install -y libunwind-dev protobuf-compiler libibverbs-dev librdmacm-dev libnuma-dev libyaml-cpp-dev libjsoncpp-dev libgoogle-glog-dev libgflags-dev libcurl4-openssl-dev ninja-build libboost-dev patchelf

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install maturin
        run: pip install maturin

      - name: Build wheel
        run: |
          ./scripts/build-wheel.sh --release ${{ matrix.cargo-features }}
          mkdir -p dist
          cp target/wheels/*.whl dist/
        env:
          CUDA_PATH: /usr/local/cuda

      - name: Generate artifact tag
        id: generate_tag
        run: |
          PYTAG=$(echo "py${{ matrix.python-version }}" | tr -d '.')
          echo "artifact_tag=${PYTAG}-${{ matrix.cuda-variant }}" >> "$GITHUB_OUTPUT"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbitkv-wheel-${{ steps.generate_tag.outputs.artifact_tag }}
          path: dist/*.whl

  build-arm-cu13:
    needs: version
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Initialize native build dependency
        run: git submodule update --init --recursive --depth 1 third-party/mooncake

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CUDA 13 toolkit and build dependencies
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/sbsa/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y \
            cuda-cudart-dev-13-0 \
            cuda-nvcc-13-0 \
            cuda-nvrtc-dev-13-0 \
            libibverbs-dev \
            librdmacm-dev \
            libnuma-dev \
            libyaml-cpp-dev \
            libjsoncpp-dev \
            libgoogle-glog-dev \
            libgflags-dev \
            libcurl4-openssl-dev \
            ninja-build \
            libboost-dev \
            patchelf \
            pkg-config \
            protobuf-compiler

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install maturin
        run: pip install maturin

      - name: Build wheel
        run: |
          ./scripts/build-wheel.sh --release --no-default-features --features cuda-13,mooncake
          mkdir -p dist
          cp target/wheels/*.whl dist/
        env:
          CUDA_PATH: /usr/local/cuda-13.0
          # Grace systems commonly use 64 KiB kernel pages, while the runner uses 4 KiB.
          JEMALLOC_SYS_WITH_LG_PAGE: "16"

      - name: Generate artifact tag
        id: generate_tag
        run: |
          PYTAG=$(echo "py${{ matrix.python-version }}" | tr -d '.')
          echo "artifact_tag=${PYTAG}-arm64-cu13" >> "$GITHUB_OUTPUT"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbitkv-wheel-${{ steps.generate_tag.outputs.artifact_tag }}
          path: dist/*.whl

  verify-artifacts:
    needs: [build, build-arm-cu13]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: orbitkv-wheel-*
          merge-multiple: true
          path: dist
      - name: Validate complete release artifacts
        run: |
          VERSION="$(python3 scripts/check-versions.py)"
          shopt -s nullglob
          WHEELS=(dist/*.whl)
          test "${#WHEELS[@]}" -eq 15
          for WHEEL in "${WHEELS[@]}"; do
            VARIANT=cu12
            if [[ "$WHEEL" == *orbitkv_llm_cu13-* ]]; then
              VARIANT=cu13
            fi
            python3 scripts/check-wheel.py "$WHEEL" --variant "$VARIANT" --version "$VERSION"
          done

  publish-release:
    if: github.event_name == 'push'
    needs: verify-artifacts
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all

      - name: Prepare wheels for release
        run: |
          mkdir -p dist-cu12 dist-cu13 dist-release
          find dist-all -name "orbitkv_llm_cu13-*.whl" -exec cp {} dist-cu13/ \;
          find dist-all -name "orbitkv_llm-*.whl" ! -name "orbitkv_llm_cu13-*" -exec cp {} dist-cu12/ \;
          cp dist-cu12/*.whl dist-cu13/*.whl dist-release/
          echo "Collected wheels:"
          ls -la dist-release/

      - name: Upload wheels to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*.whl

      - name: Publish orbitkv-llm to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-cu12/
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish orbitkv-llm-cu13 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-cu13/
          password: ${{ secrets.PYPI_API_TOKEN }}
