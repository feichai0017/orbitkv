name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: python tools/verify_manifests.py
      - run: python tools/verify_capability_matrix.py
      - run: python tools/verify_active_source.py
      - run: python tools/verify_real_model_results.py
      - run: python tools/verify_applicability_results.py

  cuda-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --manifest-path crates/orbitkv-cuda/Cargo.toml --all -- --check
      - run: cargo test --locked --manifest-path crates/orbitkv-cuda/Cargo.toml --all-targets
      - run: cargo clippy --locked --manifest-path crates/orbitkv-cuda/Cargo.toml --all-targets -- -D warnings

  ffi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --manifest-path crates/orbitkv-ffi/Cargo.toml --all -- --check
      - run: cargo test --locked --manifest-path crates/orbitkv-ffi/Cargo.toml --all-targets
      - run: cargo clippy --locked --manifest-path crates/orbitkv-ffi/Cargo.toml --all-targets -- -D warnings
      - run: cargo build --locked --manifest-path crates/orbitkv-ffi/Cargo.toml
      - name: Verify the exact ABI6 symbol set
        run: |
          nm -D --defined-only crates/orbitkv-ffi/target/debug/liborbitkv_ffi.so \
            | awk '{print $3}' \
            | grep '^orbitkv_' \
            | sort > /tmp/orbitkv-actual-symbols
          cat > /tmp/orbitkv-expected-symbols <<'EOF'
          orbitkv_abi_version
          orbitkv_manager_abort_steps_batch
          orbitkv_manager_acknowledge_reclamations_batch
          orbitkv_manager_arena_identities
          orbitkv_manager_arena_stats
          orbitkv_manager_complete_batch
          orbitkv_manager_create
          orbitkv_manager_destroy
          orbitkv_manager_prefix_attach_batch
          orbitkv_manager_prefix_evict_batch
          orbitkv_manager_prefix_lookup_batch
          orbitkv_manager_prefix_publish_batch
          orbitkv_manager_prefix_publish_release_batch
          orbitkv_manager_prefix_recycle_batch
          orbitkv_manager_prepare_batch
          orbitkv_manager_quarantine_steps_batch
          orbitkv_manager_quarantine_submissions_batch
          orbitkv_manager_recycle_requests_batch
          orbitkv_manager_release_batch
          orbitkv_manager_request_acquire_batch
          orbitkv_manager_request_fork_batch
          orbitkv_manager_stats
          orbitkv_manager_submit_batch
          EOF
          diff -u /tmp/orbitkv-expected-symbols /tmp/orbitkv-actual-symbols
      - name: Test C header and dynamic ABI
        run: |
          cc \
            -std=c11 \
            -Wall \
            -Wextra \
            -Werror \
            -Icrates/orbitkv-ffi/include \
            crates/orbitkv-ffi/tests/header_smoke.c \
            -Lcrates/orbitkv-ffi/target/debug \
            -lorbitkv_ffi \
            -Wl,-rpath,"${GITHUB_WORKSPACE}/crates/orbitkv-ffi/target/debug" \
            -o /tmp/orbitkv-ffi-header-smoke
          /tmp/orbitkv-ffi-header-smoke
      - name: Test C++ header and dynamic ABI
        run: |
          c++ \
            -std=c++17 \
            -Wall \
            -Wextra \
            -Werror \
            -Icrates/orbitkv-ffi/include \
            crates/orbitkv-ffi/tests/header_smoke.cpp \
            -Lcrates/orbitkv-ffi/target/debug \
            -lorbitkv_ffi \
            -Wl,-rpath,"${GITHUB_WORKSPACE}/crates/orbitkv-ffi/target/debug" \
            -o /tmp/orbitkv-ffi-header-smoke-cpp
          /tmp/orbitkv-ffi-header-smoke-cpp

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm run check
        working-directory: website
      - run: npm run build
        working-directory: website

  sglang-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: integrations/sglang/pyproject.toml
      - name: Install the exact SGLang integration
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest==9.1.1" "pyflakes==3.4.0" -e integrations/sglang
      - name: Fetch and verify official SGLang v0.5.17
        run: |
          sudo install -d -m 0755 -o "$(id -u)" -g "$(id -g)" /workspace
          git clone \
            --filter=blob:none \
            --depth=1 \
            --branch v0.5.17 \
            https://github.com/sgl-project/sglang.git \
            /workspace/sglang
          test "$(git -C /workspace/sglang rev-parse 'v0.5.17^{commit}')" = \
            29481685462732237d80d86076d6563e1f658102
          test "$(git -C /workspace/sglang rev-parse HEAD)" = \
            29481685462732237d80d86076d6563e1f658102
          python integrations/sglang/prepare_pinned_checkout.py \
            check-base \
            --sglang-root /workspace/sglang
      - name: Compile current integration sources without repository pycache
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/orbitkv-pycompile
        run: python -m compileall -q -f integrations/sglang
      - name: Check current integration sources for Python defects
        run: |
          python -m pyflakes \
            integrations/sglang/src \
            integrations/sglang/tests \
            integrations/sglang/bench_canonical_manager.py \
            integrations/sglang/bench_compact_control.py
      - name: Test the canonical SGLang v0.5.17 adapter
        env:
          CUDA_VISIBLE_DEVICES: ""
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: integrations/sglang/src
        run: python -m pytest -q integrations/sglang/tests
