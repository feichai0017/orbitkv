name: ci

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Reject removed product paths
        shell: bash
        run: |
          for path in \
            benchmarks \
            python \
            spikes \
            crates/loom-cuda \
            crates/loom-cuda-bridge \
            crates/loom-cuda-sys \
            crates/loom-kernels \
            crates/loom-infer-cuda-bridge \
            crates/loom-infer-cuda-sys
          do
            if [[ -e "$path" ]]; then
              echo "removed product path exists: $path"
              exit 1
            fi
          done

          forbidden_sources="$(find crates -type f \
            \( -name '*.cu' -o -name '*.cuh' -o -name '*.cpp' -o -name '*.py' \) \
            -print)"
          if [[ -n "$forbidden_sources" ]]; then
            echo "$forbidden_sources"
            echo "non-Rust product source exists under crates"
            exit 1
          fi

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Release check
        run: cargo check --workspace --release

      - name: Package contracts crate
        run: cargo package -p loom-infer

  website:
    name: website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
