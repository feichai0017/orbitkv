name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --doc
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked -p orbitkv-engine --features vllm-frontend
      - run: cargo clippy --locked -p orbitkv-engine --features vllm-frontend --all-targets -- -D warnings
      - run: python tools/verify_active_source.py
      - run: python -m unittest discover -s tools/tests -p 'test_*.py'

  executor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo check --locked -p orbitkv-executor --features cuda
      - run: cargo check --locked -p orbitkv-engine --features server --all-targets
      - run: cargo clippy --locked -p orbitkv-cuda --lib -- -D warnings

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm run check
        working-directory: website
      - run: npm run build
        working-directory: website
