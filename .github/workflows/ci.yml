name: ci

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Reject removed product paths
        shell: bash
        run: |
          for path in \
            benchmarks \
            python \
            spikes \
            crates/loom-cuda \
            crates/loom-cuda-bridge \
            crates/loom-cuda-sys \
            crates/loom-kernels \
            crates/loom-infer-cuda-bridge \
            crates/loom-infer-cuda-sys \
            crates/loom-infer-cuda/src/bin
          do
            if [[ -e "$path" ]]; then
              echo "removed product path exists: $path"
              exit 1
            fi
          done

          forbidden_sources="$(find crates -type f \
            \( -name '*.cu' -o -name '*.cuh' -o -name '*.cpp' -o -name '*.py' \) \
            -print)"
          if [[ -n "$forbidden_sources" ]]; then
            echo "$forbidden_sources"
            echo "non-Rust product source exists under crates"
            exit 1
          fi

      - name: Check
        run: make check-rust PACKAGE_FLAGS=

  website:
    name: website
    runs-on: ubuntu-latest
    env:
      NODE_ENV: development
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Audit
        run: npm audit
