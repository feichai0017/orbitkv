name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: python tools/verify_manifests.py
      - run: python tools/verify_real_model_results.py
      - run: python tools/verify_applicability_results.py

  cuda-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --manifest-path crates/orbitkv-cuda/Cargo.toml --all -- --check
      - run: cargo test --locked --manifest-path crates/orbitkv-cuda/Cargo.toml --all-targets
      - run: cargo clippy --locked --manifest-path crates/orbitkv-cuda/Cargo.toml --all-targets -- -D warnings

  ffi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --manifest-path crates/orbitkv-ffi/Cargo.toml --all -- --check
      - run: cargo test --locked --manifest-path crates/orbitkv-ffi/Cargo.toml --all-targets
      - run: cargo clippy --locked --manifest-path crates/orbitkv-ffi/Cargo.toml --all-targets -- -D warnings
      - run: cargo build --locked --manifest-path crates/orbitkv-ffi/Cargo.toml
      - name: Test C header and dynamic ABI
        run: |
          cc \
            -std=c11 \
            -Wall \
            -Wextra \
            -Werror \
            -Icrates/orbitkv-ffi/include \
            crates/orbitkv-ffi/tests/header_smoke.c \
            -Lcrates/orbitkv-ffi/target/debug \
            -lorbitkv_ffi \
            -Wl,-rpath,"${GITHUB_WORKSPACE}/crates/orbitkv-ffi/target/debug" \
            -o /tmp/orbitkv-ffi-header-smoke
          /tmp/orbitkv-ffi-header-smoke

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm run check
        working-directory: website
      - run: npm run build
        working-directory: website

  sglang-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: cargo build --locked --bin orbitkv
      - run: cargo build --locked --manifest-path crates/orbitkv-ffi/Cargo.toml
      - name: Fetch pinned SGLang hook contract
        run: |
          git clone \
            --filter=blob:none \
            --no-checkout \
            https://github.com/sgl-project/sglang.git \
            /tmp/sglang
          git -C /tmp/sglang sparse-checkout init --no-cone
          printf '%s\n' \
            python/sglang/srt/plugins/hook_registry.py \
            > /tmp/sglang/.git/info/sparse-checkout
          git -C /tmp/sglang checkout 095ec6c997bfdd25d3864cb0ce77a6562a934b96
      - run: python -m compileall -q integrations/sglang/src integrations/sglang/tests integrations/sglang/checkpoint_identity.py integrations/sglang/bench_hybrid_shadow.py integrations/sglang/bench_real_model_ab.py integrations/sglang/bench_real_model_ablation.py integrations/sglang/bench_uniform_swa_ab.py integrations/sglang/verify_physical_candidates.py integrations/sglang/bench_owner_transport.py integrations/sglang/bench_owner_e2e_ab.py
      - name: Test SGLang plugin and Rust trace analyzer
        env:
          PYTHONPATH: integrations/sglang/src
          ORBITKV_SGLANG_ROOT: /tmp/sglang
          ORBITKV_BIN: ${{ github.workspace }}/target/debug/orbitkv
          ORBITKV_PLAN: ${{ github.workspace }}/examples/full_swa.json
          ORBITKV_OWNER_LIB: ${{ github.workspace }}/crates/orbitkv-ffi/target/debug/liborbitkv_ffi.so
        run: python -m unittest discover -s integrations/sglang/tests -v
