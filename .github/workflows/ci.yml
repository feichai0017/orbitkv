name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: python tools/verify_capability_matrix.py
      - run: python tools/verify_active_source.py

  ffi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --manifest-path core/ffi/Cargo.toml --all -- --check
      - run: cargo test --locked --manifest-path core/ffi/Cargo.toml --all-targets
      - run: cargo clippy --locked --manifest-path core/ffi/Cargo.toml --all-targets -- -D warnings
      - run: cargo build --locked --manifest-path core/ffi/Cargo.toml
      - name: Verify the exact 48-symbol wire set
        run: |
          nm -D --defined-only target/debug/liborbitkv_ffi.so \
            | awk '{print $3}' \
            | grep '^orbitkv_' \
            | sort > /tmp/orbitkv-actual-symbols
          cat > /tmp/orbitkv-expected-symbols <<'EOF'
          orbitkv_session_abort_control
          orbitkv_session_abort_prepared
          orbitkv_session_abort_prepared_relocation
          orbitkv_session_acquire_requests
          orbitkv_session_arena_identities
          orbitkv_session_arena_stats
          orbitkv_session_cancel_pending_attach
          orbitkv_session_commit_control
          orbitkv_session_complete_execution
          orbitkv_session_complete_relocation
          orbitkv_session_confirm_control
          orbitkv_session_confirm_publication
          orbitkv_session_confirm_release
          orbitkv_session_confirm_relocation_publication
          orbitkv_session_create
          orbitkv_session_destroy
          orbitkv_session_finalize_pending_attach_cancel
          orbitkv_session_mark_token_dispositions_batch
          orbitkv_session_prefix_lookup_batch
          orbitkv_session_prefix_publish_batch
          orbitkv_session_prefix_publish_release_batch
          orbitkv_session_prepare_append
          orbitkv_session_prepare_prefix_attach
          orbitkv_session_prepare_prefix_evict
          orbitkv_session_prepare_release
          orbitkv_session_prepare_relocation_batch
          orbitkv_session_prepare_request_fork
          orbitkv_session_quarantine_control
          orbitkv_session_quarantine_prepared
          orbitkv_session_quarantine_relocation
          orbitkv_session_quarantine_submitted
          orbitkv_session_read_control_plan
          orbitkv_session_stats
          orbitkv_session_submit_execution
          orbitkv_session_submit_relocation
          orbitkv_session_token_views_batch
          orbitkv_state_pool_abort_batch
          orbitkv_state_pool_acknowledge_batch
          orbitkv_state_pool_complete_batch
          orbitkv_state_pool_create
          orbitkv_state_pool_current_batch
          orbitkv_state_pool_destroy
          orbitkv_state_pool_identity
          orbitkv_state_pool_prepare_batch
          orbitkv_state_pool_retire_owners_batch
          orbitkv_state_pool_stats
          orbitkv_state_pool_submit_batch
          orbitkv_wire_version
          EOF
          diff -u /tmp/orbitkv-expected-symbols /tmp/orbitkv-actual-symbols
      - name: Test C header and dynamic wire
        run: |
          cc \
            -std=c11 \
            -Wall \
            -Wextra \
            -Werror \
            -Icore/ffi/include \
            core/ffi/tests/header_smoke.c \
            -Ltarget/debug \
            -lorbitkv_ffi \
            -Wl,-rpath,"${GITHUB_WORKSPACE}/target/debug" \
            -o /tmp/orbitkv-ffi-header-smoke
          /tmp/orbitkv-ffi-header-smoke
      - name: Test C++ header and dynamic wire
        run: |
          c++ \
            -std=c++17 \
            -Wall \
            -Wextra \
            -Werror \
            -Icore/ffi/include \
            core/ffi/tests/header_smoke.cpp \
            -Ltarget/debug \
            -lorbitkv_ffi \
            -Wl,-rpath,"${GITHUB_WORKSPACE}/target/debug" \
            -o /tmp/orbitkv-ffi-header-smoke-cpp
          /tmp/orbitkv-ffi-header-smoke-cpp

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm run check
        working-directory: website
      - run: npm run build
        working-directory: website

  sglang-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: compat/sglang/bridge/pyproject.toml
      - name: Install test and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build "pytest==9.1.1" "pyflakes==3.4.0"
      - name: Fetch, apply, and verify the complete pinned SGLang source
        run: |
          sudo install -d -m 0755 -o "$(id -u)" -g "$(id -g)" /workspace
          sglang_release=$(PYTHONPATH=compat/sglang/bridge/src python -c \
            'from orbitkv_sglang.pinned import pinned_source_contract; print(pinned_source_contract()["release"])')
          sglang_revision=$(PYTHONPATH=compat/sglang/bridge/src python -c \
            'from orbitkv_sglang.pinned import pinned_source_contract; print(pinned_source_contract()["revision"])')
          git clone \
            --filter=blob:none \
            --depth=1 \
            --branch "${sglang_release}" \
            https://github.com/sgl-project/sglang.git \
            /workspace/sglang
          test "$(git -C /workspace/sglang rev-parse "${sglang_release}^{commit}")" = \
            "${sglang_revision}"
          test "$(git -C /workspace/sglang rev-parse HEAD)" = "${sglang_revision}"
          python compat/sglang/tools/prepare_source.py \
            check-base \
            --sglang-root /workspace/sglang
          python compat/sglang/tools/prepare_source.py \
            apply \
            --sglang-root /workspace/sglang
          python tools/verify_engine_profile.py \
            --sglang-root /workspace/sglang
      - name: Install the single-source OrbitKV Engine
        env:
          SGLANG_BUILD_RUST_EXTS: none
        run: |
          python -m pip install -e /workspace/sglang/python
          python -m pip install --no-deps -e compat/sglang/bridge
          python - <<'PY'
          import importlib.metadata as metadata
          from pathlib import Path

          import sglang

          package = Path(sglang.__file__).resolve(strict=True)
          pinned = Path("/workspace/sglang/python/sglang").resolve(strict=True)
          assert package.is_relative_to(pinned), (package, pinned)
          requirements = metadata.distribution("orbitkv-sglang").requires or ()
          assert all(not item.lower().startswith("sglang") for item in requirements)
          PY
      - name: Assemble the complete source product
        run: |
          python compat/sglang/assemble.py \
            --sglang-root /workspace/sglang \
            --output "${RUNNER_TEMP}/orbitkv-engine-source"
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("${{ runner.temp }}/orbitkv-engine-source")
          manifest = json.loads(
              (root / "orbitkv-engine-manifest.json").read_text(encoding="utf-8")
          )
          assert manifest["schema"] == "orbitkv.engine-source-manifest"
          assert (root / "python/sglang/__init__.py").is_file()
          assert (root / "orbitkv/adapter/pyproject.toml").is_file()
          assert (root / "orbitkv/manager/Cargo.toml").is_file()
          assert (root / "orbitkv/manager/ffi/include/orbitkv.h").is_file()
          PY
          cargo metadata --no-deps --format-version 1 \
            --manifest-path \
            "${RUNNER_TEMP}/orbitkv-engine-source/orbitkv/manager/Cargo.toml"
          cargo metadata --no-deps --format-version 1 \
            --manifest-path \
            "${RUNNER_TEMP}/orbitkv-engine-source/orbitkv/manager/ffi/Cargo.toml"
      - name: Compile current integration sources without repository pycache
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/orbitkv-pycompile
        run: python -m compileall -q -f compat/sglang/bridge compat/sglang/tools
      - name: Check current integration sources for Python defects
        run: |
          {
            find compat/sglang/bridge/src compat/sglang/tests tests \
              -type f -name '*.py' -print0
            find compat compat/sglang/tools tools \
              -maxdepth 1 -type f -name '*.py' -print0
          } | xargs -0 python -m pyflakes
      - name: Test the OrbitKV Engine adapter
        env:
          CUDA_VISIBLE_DEVICES: ""
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: compat/sglang/bridge/src
        run: python -m pytest -q compat/sglang/tests tests
