[package]
name = "orbitkv-executor"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Native Luminal execution boundary for OrbitKV."
license = "MIT"

[features]
default = []
cuda = ["dep:luminal", "dep:luminal_cuda_lite", "dep:luminal_nn"]

[dependencies]
luminal = { git = "https://github.com/feichai0017/orbitkv-luminal.git", rev = "9b8ac26243bae5bc5c37fb56ee3eb6554a05e7bc", optional = true }
luminal_cuda_lite = { git = "https://github.com/feichai0017/orbitkv-luminal.git", rev = "9b8ac26243bae5bc5c37fb56ee3eb6554a05e7bc", optional = true }
luminal_nn = { git = "https://github.com/feichai0017/orbitkv-luminal.git", rev = "9b8ac26243bae5bc5c37fb56ee3eb6554a05e7bc", optional = true }
orbitkv = { path = "../core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
