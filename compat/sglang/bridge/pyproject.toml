[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitkv-sglang"
version = "0.2.0"
description = "Direct-source SGLang integration for OrbitKV Engine."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
orbitkv-engine = "orbitkv_sglang.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
orbitkv_sglang = ["resources/*.json"]

[tool.setuptools.packages.find]
where = ["src"]
