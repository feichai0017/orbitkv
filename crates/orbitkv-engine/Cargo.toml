[package]
name = "orbitkv-engine"
authors.workspace = true
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "OrbitKV inference scheduling, execution coordination, and optional HTTP frontend."
license = "MIT"

[features]
default = []
cuda = ["orbitkv-executor/cuda"]
vllm-frontend = [
    "dep:anyhow",
    "dep:tokio-util",
    "dep:vllm-engine-core-client",
    "dep:vllm-server",
    "dep:zeromq",
    "tokio/macros",
    "tokio/rt-multi-thread",
    "tokio/time",
]
server = [
    "cuda",
    "dep:serde_json",
    "dep:anyhow",
    "dep:clap",
    "dep:tokio-util",
    "vllm-frontend",
    "tokio/macros",
    "tokio/rt-multi-thread",
    "tokio/signal",
]

[dependencies]
futures-core = "=0.3.31"
futures-util = "0.3.31"
anyhow = { version = "1.0.100", optional = true }
clap = { version = "4.6.0", features = ["derive"], optional = true }
orbitkv = { path = "../orbitkv" }
orbitkv-executor = { path = "../orbitkv-executor" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.145", optional = true }
thiserror = "2.0.17"
tempfile = "3.23.0"
tokio = { version = "1.47.1", features = ["sync"] }
tokio-util = { version = "0.7.18", features = ["rt"], optional = true }
vllm-engine-core-client = { git = "https://github.com/vllm-project/vllm.git", rev = "60857baa53a743913d4e919f12b5fd8d608ded86", optional = true }
vllm-server = { git = "https://github.com/vllm-project/vllm.git", rev = "60857baa53a743913d4e919f12b5fd8d608ded86", optional = true }
zeromq = { version = "0.6.0", default-features = false, features = ["tokio-runtime", "all-transport"], optional = true }

[[bin]]
name = "orbitkv-serve"
path = "src/bin/serve/main.rs"
required-features = ["server"]

[dev-dependencies]
reqwest = { version = "0.12.8", default-features = false, features = ["json"] }
serde_json = "1.0.145"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
