[package]
name = "orbitkv-cuda"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "NVIDIA CUDA physical-memory backends for OrbitKV."
license = "MIT"
repository = "https://github.com/feichai0017/orbitkv"

[dependencies]
cudarc = { version = "=0.19.8", default-features = false, features = [
  "std",
  "driver",
  "cuda-13010",
  "dynamic-loading",
] }
orbitkv = { path = "../.." }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "deny"
pedantic = "deny"
