[package]
name = "loom-infer-validation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Hardware validation programs for Loom Infer providers"
readme = "README.md"
publish = false

[features]
default = []
cuda = [
    "loom-infer-cuda/cuda",
    "dep:cuda-core",
    "dep:half",
    "dep:serde",
    "dep:serde_json",
]

[dependencies]
cuda-core = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "868f8ec4ef900bae7e67e7f9508b2da66eee5472", optional = true }
half = { workspace = true, optional = true }
loom-infer = { path = "../loom-infer" }
loom-infer-cuda = { path = "../loom-infer-cuda" }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[[bin]]
name = "rms_norm_h20"
path = "src/bin/rms_norm_h20.rs"
required-features = ["cuda"]

[[bin]]
name = "bf16_gemm_h20"
path = "src/bin/bf16_gemm_h20.rs"
required-features = ["cuda"]

[[bin]]
name = "single_decode_h20"
path = "src/bin/single_decode_h20.rs"
required-features = ["cuda"]

[[bin]]
name = "paged_batch_decode_h20"
path = "src/bin/paged_batch_decode_h20.rs"
required-features = ["cuda"]

[[bin]]
name = "ragged_prefill_h20"
path = "src/bin/ragged_prefill_h20.rs"
required-features = ["cuda"]

[[bin]]
name = "paged_prefill_h20"
path = "src/bin/paged_prefill_h20.rs"
required-features = ["cuda"]

[[bin]]
name = "rope_h20"
path = "src/bin/rope_h20.rs"
required-features = ["cuda"]

[[bin]]
name = "loom_matched_bench_h20"
path = "src/bin/loom_matched_bench_h20.rs"
required-features = ["cuda"]

[[bin]]
name = "ragged_graph_bench_h20"
path = "src/bin/ragged_graph_bench_h20.rs"
required-features = ["cuda"]

[[bin]]
name = "paged_prefill_graph_bench_h20"
path = "src/bin/paged_prefill_graph_bench_h20.rs"
required-features = ["cuda"]

[[bin]]
name = "rope_append_graph_bench_h20"
path = "src/bin/rope_append_graph_bench_h20.rs"
required-features = ["cuda"]

[[bin]]
name = "split_k_sweep_h20"
path = "src/bin/split_k_sweep_h20.rs"
required-features = ["cuda"]

[[bin]]
name = "engine_interop_h20"
path = "src/bin/engine_interop_h20.rs"
required-features = ["cuda"]

[lints]
workspace = true
