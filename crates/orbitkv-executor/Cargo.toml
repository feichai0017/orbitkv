[package]
name = "orbitkv-executor"
authors.workspace = true
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Model compilation and device execution boundary for OrbitKV."
license = "MIT"

[features]
default = []
cuda = [
    "dep:orbitkv-compiler",
    "dep:orbitkv-cuda",
    "dep:orbitkv-ops",
    "dep:orbitkv-tracing",
]

[dependencies]
async-trait = "0.1.89"
orbitkv-compiler = { workspace = true, optional = true }
orbitkv-cuda = { workspace = true, optional = true }
orbitkv-ops = { workspace = true, optional = true }
orbitkv-tracing = { workspace = true, optional = true }
orbitkv = { workspace = true }
parking_lot = "0.12.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"

[dev-dependencies]
half = "2.7.1"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
