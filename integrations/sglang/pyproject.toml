[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitkv-sglang"
version = "0.2.0"
description = "Breaking-only SGLang adapter for the canonical OrbitKV block manager."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["sglang==0.5.17"]

[project.entry-points."sglang.srt.plugins"]
orbitkv_manager = "orbitkv_sglang.plugin:register"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
