[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitkv-sglang"
version = "0.1.0"
description = "SGLang instrumentation and owning adapter for the Rust OrbitKV block manager."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.entry-points."sglang.srt.plugins"]
orbitkv_shadow = "orbitkv_sglang.plugin:register"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
