[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitkv-reference"
version = "0.1.0"
description = "Reference tensor-arena implementation of the OrbitKV adapter SPI."
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["orbitkv-runtime>=0.1,<0.2"]

[project.optional-dependencies]
torch = ["torch"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
