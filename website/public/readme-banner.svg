  <text x="46" y="150" font-family="Arial, Helvetica, sans-serif" font-size="49" letter-spacing="-2" fill="#202d26">Compile the lifetime of <tspan fill="#ab4d29" font-family="Georgia, serif" font-style="italic">state.</tspan></text>
