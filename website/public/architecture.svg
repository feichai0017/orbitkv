<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img" aria-labelledby="title desc">
  <title id="title">OrbitKV process ownership and communication paths</title>
  <desc id="desc">Each engine owns HBM, framework scheduling and the Rust raw DRAM restore executor. Its Manager owns shared pinned DRAM, SSD, source grants and budgets. UDS transfers file descriptors; iceoryx2 carries commands; completion records and eventfd report progress. Manager Publish and SSD or encoded restores use CUDA IPC. Independent Managers discover and authorize historical cache reads over gRPC and transfer payloads with Mooncake TENT. Separate P/D adapters write current-request KV between engines. etcd maintains membership and fixed placement in the background. Catalogs have one copy per shard. Raw restore plans are partitioned under one whole-operation fence. Group overlap, binary peer metadata and a unified route optimizer remain planned.</desc>
